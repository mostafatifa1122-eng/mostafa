<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة متكاملة في ملف واحد</title>
    
    <!-- هنا ينكتب كود الـ CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>

    <!-- هنا عناصر الـ HTML -->
    <div class="card">
        <h2>مرحباً بك!</h2>
        <p>اضغط على الزر بالأسفل لتشغيل كود الـ JavaScript.</p>
        <button id="btn">اضغط هنا</button>
        <p id="message"></p>
    </div>

    <!-- هنا ينكتب كود الـ JavaScript -->
    <script>
        const button = document.getElementById('btn');
        const message = document.getElementById('message');

        button.addEventListener('click', () => {
            message.textContent = 'تم التفاعل بنجاح من داخل نفس الملف! 🎉';
        });
    </script>
</body>
</html>
