<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- إعدادات viewport ضرورية جداً لعمل الموبايل والآيفون بشكل صحيح -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجر النخبة | Elite Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #d4af37;
            --bg: #f8fafc;
            --white: #ffffff;
            --text: #334155;
            --danger: #ef4444;
            --success: #22c55e;
            --whatsapp: #25D366;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Tajawal', sans-serif; 
            -webkit-tap-highlight-color: transparent; /* إزالة الوميض الأزرق في الآيفون */
        }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            padding-bottom: 80px; 
            overflow-x: hidden; /* منع التمرير الأفقي */
        }

        /* --- Header Responsive --- */
        header {
            background: var(--primary);
            color: var(--white);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .logo { font-size: 1.4rem; font-weight: 900; color: var(--accent); }
        
        .header-icons { display: flex; gap: 15px; align-items: center; }
        
        .cart-icon-wrap { position: relative; cursor: pointer; padding: 5px; }
        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--danger);
            color: white;
            font-size: 0.7rem;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 2px solid var(--primary);
        }

        .admin-btn { 
            background: rgba(255,255,255,0.1); 
            border: 1px solid var(--accent); 
            color: var(--accent); 
            padding: 6px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 0.85rem; 
            transition: 0.3s; 
        }

        /* --- Hero Section --- */
        .hero {
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
            padding: 50px 20px;
            margin-bottom: 20px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .hero h1 { font-size: 2rem; margin-bottom: 10px; color: var(--accent); line-height: 1.3; }
        .hero p { font-size: 1rem; opacity: 0.9; max-width: 600px; margin: 0 auto; }

        /* --- Container & Grid --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }
        
        .section-title { font-size: 1.5rem; margin-bottom: 20px; border-right: 5px solid var(--accent); padding-right: 15px; color: var(--primary); }

        /* Grid System متجاوب تلقائياً */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); /* للموبايل الصغير */
            gap: 15px;
        }

        @media (min-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); /* للتابلت والكمبيوتر */
                gap: 25px;
            }
            .hero h1 { font-size: 2.5rem; }
        }

        .product-card {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover { transform: translateY(-3px); }

        .product-img { 
            width: 100%; 
            aspect-ratio: 3/4; /* نسبة صورة ثابتة جميلة */
            object-fit: cover; 
            background: #eee;
        }

        .product-details { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-name { font-size: 1rem; font-weight: 700; margin-bottom: 5px; color: var(--primary); line-height: 1.3; }
        .product-price { color: var(--accent); font-size: 1.1rem; font-weight: 900; margin-bottom: 5px; }
        .product-stock { font-size: 0.8rem; color: #777; margin-bottom: 10px; }

        .add-to-cart-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }
        .add-to-cart-btn:active { transform: scale(0.98); }

        /* --- Admin Panel --- */
        #admin-panel {
            display: none;
            background: var(--white);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 2px solid var(--accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-admin { background: none; border: none; font-size: 1.8rem; cursor: pointer; color: var(--danger); line-height: 1; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        
        .btn-submit { background: var(--success); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; }

        /* --- Cart Modal (Full Screen on Mobile) --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            justify-content: center;
            align-items: flex-end; /* يظهر من الأسفل في الموبايل */
        }

        @media (min-width: 768px) {
            .modal { align-items: center; }
        }

        .modal-content {
            background: var(--white);
            width: 100%;
            max-width: 500px;
            border-radius: 20px 20px 0 0;
            padding: 25px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s ease-out;
        }

        @media (min-width: 768px) {
            .modal-content { border-radius: 20px; max-height: 80vh; }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .cart-item-info { display: flex; align-items: center; gap: 10px; flex: 1; }
        .cart-item-img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
        .remove-item { color: var(--danger); cursor: pointer; border: none; background: none; font-size: 1.3rem; padding: 10px; }

        .cart-total { margin-top: 20px; font-size: 1.2rem; font-weight: bold; text-align: left; color: var(--primary); border-top: 2px solid #eee; padding-top: 15px; }

        .checkout-btn {
            background: var(--whatsapp);
            color: white;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        }
        .checkout-btn:active { transform: scale(0.98); }

        /* --- Login Modal --- */
        #login-modal {
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border-top: 5px solid var(--accent);
        }
        .login-input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            text-align: center;
        }

        /* --- Toast --- */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            z-index: 3000;
            width: max-content;
            max-width: 90%;
            text-align: center;
        }
        .toast.show { opacity: 1; visibility: visible; bottom: 40px; }

    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول (تظهر مرة واحدة فقط) -->
    <div id="login-modal" class="modal">
        <div class="login-box">
            <h2 style="color: var(--primary); margin-bottom: 10px;">مرحباً بك في النخبة</h2>
            <p style="color: #666; margin-bottom: 20px; font-size: 0.9rem;">سجل بياناتك لتتمكن من إتمام الطلب</p>
            <form id="login-form">
                <input type="tel" id="user-phone" class="login-input" placeholder="رقم الموبايل" required pattern="[0-9]*" inputmode="numeric">
                <input type="email" id="user-email" class="login-input" placeholder="البريد الإلكتروني" required inputmode="email">
                <button type="submit" class="btn-submit" style="background: var(--primary); margin-top: 10px;">دخول المتجر</button>
            </form>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo"><i class="fas fa-gem"></i> النخبة</div>
        <div class="header-icons">
            <button class="admin-btn" onclick="toggleAdmin()"><i class="fas fa-lock"></i></button>
            <div class="cart-icon-wrap" onclick="toggleCart()">
                <i class="fas fa-shopping-bag fa-lg"></i>
                <span class="cart-count" id="cart-count">0</span>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <div class="hero">
        <h1>أهلاً بك في عالم الفخامة</h1>
        <p>أفضل تشكيلة ملابس عصرية بجودة عالمية</p>
    </div>

    <div class="container">
        
        <!-- Admin Panel -->
        <div id="admin-panel">
            <div class="admin-header">
                <h2><i class="fas fa-cogs"></i> لوحة التحكم</h2>
                <button class="close-admin" onclick="toggleAdmin()">&times;</button>
            </div>
            <form id="add-product-form">
                <div class="form-group">
                    <label>اسم المنتج</label>
                    <input type="text" id="p-name" class="form-control" required placeholder="مثال: قميص كتان">
                </div>
                <div class="form-group">
                    <label>السعر (ج.م)</label>
                    <input type="number" id="p-price" class="form-control" required placeholder="000" inputmode="numeric">
                </div>
                <div class="form-group">
                    <label>الكمية</label>
                    <input type="number" id="p-qty" class="form-control" required placeholder="00" inputmode="numeric">
                </div>
                <div class="form-group">
                    <label>صورة المنتج</label>
                    <input type="file" id="p-image" class="form-control" accept="image/*" required>
                </div>
                <button type="submit" class="btn-submit">إضافة المنتج</button>
            </form>
            
            <h3 style="margin-top: 30px; margin-bottom: 15px; font-size: 1.1rem;">المنتجات الحالية (للحذف)</h3>
            <div id="admin-products-list" class="products-grid"></div>
        </div>

        <!-- Customer View -->
        <h2 class="section-title">أحدث المنتجات</h2>
        <div class="products-grid" id="customer-products-grid">
            <!-- Products injected here -->
        </div>
    </div>

    <!-- Cart Modal -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2><i class="fas fa-shopping-cart"></i> سلة المشتريات</h2>
                <button onclick="toggleCart()" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:#333;">&times;</button>
            </div>
            <div id="cart-items-container">
                <!-- Cart items here -->
            </div>
            <div class="cart-total" id="cart-total-display">الإجمالي: 0 ج.م</div>
            
            <button class="checkout-btn" onclick="checkoutWhatsApp()">
                <i class="fab fa-whatsapp"></i> إتمام الطلب عبر واتساب
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">تمت الإضافة للسلة!</div>

    <script>
        // --- إعدادات المتجر ---
        const ADMIN_WHATSAPP_NUMBER = "201000000000"; // ⚠️ غير الرقم هنا

        // --- إدارة البيانات ---
        let products = JSON.parse(localStorage.getItem('elite_products')) || [];
        let cart = JSON.parse(localStorage.getItem('elite_cart')) || [];
        let userInfo = JSON.parse(localStorage.getItem('elite_user_info')) || null;

        // --- تهيئة الصفحة ---
        document.addEventListener('DOMContentLoaded', () => {
            checkLogin();
            renderProducts();
            updateCartCount();
        });

        // --- نظام التسجيل (مرة واحدة) ---
        function checkLogin() {
            const modal = document.getElementById('login-modal');
            if (!userInfo) {
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden'; // منع التمرير خلف المودال
            } else {
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const phone = document.getElementById('user-phone').value;
            const email = document.getElementById('user-email').value;
            
            if(phone && email) {
                userInfo = { phone, email };
                localStorage.setItem('elite_user_info', JSON.stringify(userInfo));
                checkLogin();
                showToast("تم تسجيل دخولك بنجاح");
            }
        });

        // --- عرض المنتجات ---
        function renderProducts() {
            const customerGrid = document.getElementById('customer-products-grid');
            const adminList = document.getElementById('admin-products-list');
            
            customerGrid.innerHTML = '';
            adminList.innerHTML = '';

            if (products.length === 0) {
                customerGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #777;">لا توجد منتجات حالياً</div>';
                return;
            }

            products.forEach(product => {
                // للعميل
                const card = `
                    <div class="product-card">
                        <img src="${product.image}" alt="${product.name}" class="product-img" loading="lazy">
                        <div class="product-details">
                            <div>
                                <div class="product-name">${product.name}</div>
                                <div class="product-price">${product.price} ج.م</div>
                                <div class="product-stock">المتبقي: ${product.qty}</div>
                            </div>
                            <button class="add-to-cart-btn" onclick="addToCart(${product.id})">
                                <i class="fas fa-cart-plus"></i> أضف
                            </button>
                        </div>
                    </div>
                `;
                customerGrid.innerHTML += card;

                // للأدمن
                const adminCard = `
                    <div class="product-card" style="border:1px solid #eee;">
                        <img src="${product.image}" class="product-img" style="height:150px;">
                        <div class="product-details">
                            <div class="product-name">${product.name}</div>
                            <button onclick="deleteProduct(${product.id})" style="background:var(--danger); color:white; border:none; padding:8px; width:100%; border-radius:6px; margin-top:5px;">حذف</button>
                        </div>
                    </div>
                `;
                adminList.innerHTML += adminCard;
            });
        }

        // --- السلة ---
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (!product || product.qty <= 0) return;

            const existingItem = cart.find(item => item.id === id);
            if (existingItem) {
                if (existingItem.qty < product.qty) existingItem.qty++;
                else { showToast("الكمية المتاحة نفذت"); return; }
            } else {
                cart.push({ ...product, qty: 1 });
            }

            saveCart();
            updateCartCount();
            showToast("تمت الإضافة للسلة");
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            saveCart();
            renderCartItems();
            updateCartCount();
        }

        function saveCart() {
            localStorage.setItem('elite_cart', JSON.stringify(cart));
        }

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cart-count').innerText = count;
        }

        // --- لوحة الأدمن ---
        function toggleAdmin() {
            const panel = document.getElementById('admin-panel');
            if (panel.style.display === 'none' || panel.style.display === '') {
                const pass = prompt("كلمة سر المدير:");
                if (pass === "1234") {
                    panel.style.display = 'block';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    renderProducts();
                } else if (pass !== null) alert("خطأ!");
            } else {
                panel.style.display = 'none';
            }
        }

        document.getElementById('add-product-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const qty = document.getElementById('p-qty').value;
            const imageInput = document.getElementById('p-image');

            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    products.push({
                        id: Date.now(),
                        name, price, qty,
                        image: e.target.result
                    });
                    localStorage.setItem('elite_products', JSON.stringify(products));
                    this.reset();
                    renderProducts();
                    alert("تمت الإضافة!");
                }.bind(this);
                reader.readAsDataURL(imageInput.files[0]);
            }
        });

        function deleteProduct(id) {
            if(confirm("حذف المنتج؟")) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('elite_products', JSON.stringify(products));
                renderProducts();
            }
        }

        // --- الواتساب والدفع ---
        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                renderCartItems();
                modal.style.display = 'flex';
            }
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items-container');
            const totalDisplay = document.getElementById('cart-total-display');
            
            if (cart.length === 0) {
                container.innerHTML = '<p style="text-align: center; padding: 20px; color: #777;">السلة فارغة</p>';
                totalDisplay.innerText = 'الإجمالي: 0 ج.م';
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                html += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <img src="${item.image}" class="cart-item-img">
                            <div>
                                <div style="font-weight:bold; font-size:0.95rem;">${item.name}</div>
                                <div style="font-size:0.85rem; color:#777;">${item.qty} × ${item.price} ج.م</div>
                            </div>
                        </div>
                        <button class="remove-item" onclick="removeFromCart(${item.id})"><i class="fas fa-trash-alt"></i></button>
                    </div>
                `;
            });

            container.innerHTML = html;
            totalDisplay.innerText = `الإجمالي: ${total} ج.م`;
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) {
                alert("السلة فارغة!");
                return;
            }
            if (!userInfo) {
                alert("يرجى تسجيل الدخول أولاً");
                checkLogin();
                toggleCart();
                return;
            }

            let message = `*طلب جديد من المتجر*%0a`;
            message += `---------------------------%0a`;
            message += `*بيانات العميل:*%0a`;
            message += `📱 الموبايل: ${userInfo.phone}%0a`;
            message += `📧 الايميل: ${userInfo.email}%0a`;
            message += `---------------------------%0a`;
            message += `*المنتجات:*%0a`;
            
            let total = 0;
            cart.forEach((item, index) => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                message += `${index + 1}. ${item.name} (عدد: ${item.qty}) - ${itemTotal} ج.م%0a`;
            });

            message += `%0a*💰 الإجمالي الكلي: ${total} ج.م*`;
            message += `%0a%0aيرجى تأكيد الطلب وتفاصيل الشحن.`;

            const url = `https://wa.me/${ADMIN_WHATSAPP_NUMBER}?text=${message}`;
            window.open(url, '_blank');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        window.onclick = function(event) {
            const cartModal = document.getElementById('cart-modal');
            const loginModal = document.getElementById('login-modal');
            if (event.target == cartModal) cartModal.style.display = "none";
            // لا تغلق مودال اللوجين بالنقر خارجه لإجبار المستخدم على التسجيل
        }
    </script>
</body>
</html>
