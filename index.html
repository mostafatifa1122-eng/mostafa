<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر النخبة | Elite Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #d4af37;
            --bg: #f8fafc;
            --white: #ffffff;
            --text: #334155;
            --danger: #ef4444;
            --success: #22c55e;
            --whatsapp: #25D366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        
        body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; }

        /* --- Header --- */
        header {
            background: var(--primary);
            color: var(--white);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .logo { font-size: 1.5rem; font-weight: 900; color: var(--accent); letter-spacing: 1px; }
        
        .header-icons { display: flex; gap: 15px; align-items: center; }
        
        .cart-icon-wrap { position: relative; cursor: pointer; }
        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--danger);
            color: white;
            font-size: 0.7rem;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .admin-btn { background: none; border: 1px solid var(--accent); color: var(--accent); padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.9rem; transition: 0.3s; }
        .admin-btn:hover { background: var(--accent); color: var(--primary); }

        /* --- Hero Section --- */
        .hero {
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
            padding: 60px 20px;
            margin-bottom: 30px;
        }
        .hero h1 { font-size: 2.5rem; margin-bottom: 10px; color: var(--accent); }
        .hero p { font-size: 1.1rem; opacity: 0.9; }

        /* --- Products Grid --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        .section-title { font-size: 1.8rem; margin-bottom: 20px; border-right: 5px solid var(--accent); padding-right: 15px; color: var(--primary); }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--white);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
            position: relative;
        }

        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

        .product-img { width: 100%; height: 300px; object-fit: cover; }

        .product-details { padding: 20px; }
        .product-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; color: var(--primary); }
        .product-price { color: var(--accent); font-size: 1.2rem; font-weight: 900; margin-bottom: 10px; }
        .product-stock { font-size: 0.85rem; color: #777; margin-bottom: 15px; }

        .add-to-cart-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .add-to-cart-btn:hover { background: var(--accent); color: var(--primary); }

        /* --- Admin Panel --- */
        #admin-panel {
            display: none;
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 40px;
            border: 2px solid var(--accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-admin { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--danger); }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        
        .btn-submit { background: var(--success); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }

        /* --- Cart Modal --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--white);
            width: 90%;
            max-width: 500px;
            border-radius: 15px;
            padding: 25px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .cart-item-info { display: flex; align-items: center; gap: 10px; }
        .cart-item-img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
        .remove-item { color: var(--danger); cursor: pointer; border: none; background: none; font-size: 1.2rem; }

        .cart-total { margin-top: 20px; font-size: 1.3rem; font-weight: bold; text-align: left; color: var(--primary); border-top: 2px solid #eee; padding-top: 15px; }

        .checkout-btn {
            background: var(--whatsapp);
            color: white;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }
        .checkout-btn:hover { background: #1ebc57; }

        /* --- Checkout Form Styles --- */
        .checkout-form { margin-top: 20px; background: #f1f5f9; padding: 15px; border-radius: 10px; }
        .checkout-form h3 { margin-bottom: 15px; font-size: 1.1rem; color: var(--primary); }
        .form-row { margin-bottom: 10px; }
        .form-row input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
        .form-row input:focus { border-color: var(--accent); outline: none; ring: 2px solid var(--accent); }

        /* --- Notification --- */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            z-index: 3000;
        }
        .toast.show { opacity: 1; visibility: visible; bottom: 40px; }

    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo"><i class="fas fa-gem"></i> النخبة</div>
        <div class="header-icons">
            <button class="admin-btn" onclick="toggleAdmin()"><i class="fas fa-lock"></i> الإدارة</button>
            <div class="cart-icon-wrap" onclick="toggleCart()">
                <i class="fas fa-shopping-bag fa-lg"></i>
                <span class="cart-count" id="cart-count">0</span>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <div class="hero">
        <h1>أهلاً بك في عالم الفخامة</h1>
        <p>أفضل تشكيلة ملابس عصرية بجودة عالمية - الدفع عند الاستلام</p>
    </div>

    <div class="container">
        
        <!-- Admin Panel (Hidden by default) -->
        <div id="admin-panel">
            <div class="admin-header">
                <h2><i class="fas fa-cogs"></i> لوحة تحكم المدير</h2>
                <button class="close-admin" onclick="toggleAdmin()">&times;</button>
            </div>
            <form id="add-product-form">
                <div class="form-group">
                    <label>اسم المنتج</label>
                    <input type="text" id="p-name" class="form-control" required placeholder="مثال: قميص كتان فاخر">
                </div>
                <div class="form-group">
                    <label>السعر (ج.م)</label>
                    <input type="number" id="p-price" class="form-control" required placeholder="000">
                </div>
                <div class="form-group">
                    <label>الكمية المتاحة</label>
                    <input type="number" id="p-qty" class="form-control" required placeholder="00">
                </div>
                <div class="form-group">
                    <label>صورة المنتج</label>
                    <input type="file" id="p-image" class="form-control" accept="image/*" required>
                </div>
                <button type="submit" class="btn-submit">إضافة المنتج للمتجر</button>
            </form>
            
            <h3 style="margin-top: 30px; margin-bottom: 15px;">المنتجات الحالية (للحذف)</h3>
            <div id="admin-products-list" class="products-grid"></div>
        </div>

        <!-- Customer View -->
        <h2 class="section-title">أحدث المنتجات</h2>
        <div class="products-grid" id="customer-products-grid">
            <!-- Products will be injected here -->
        </div>
    </div>

    <!-- Cart Modal -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2><i class="fas fa-shopping-cart"></i> سلة المشتريات</h2>
                <button onclick="toggleCart()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            
            <div id="cart-items-container">
                <!-- Cart items here -->
            </div>
            
            <div class="cart-total" id="cart-total-display">الإجمالي: 0 ج.م</div>
            
            <!-- زر إظهار نموذج البيانات -->
            <button id="btn-show-checkout" class="checkout-btn" onclick="showCheckoutForm()">
                <i class="fas fa-truck"></i> إتمام الطلب (دفع عند الاستلام)
            </button>

            <!-- نموذج بيانات العميل (مخفي في البداية) -->
            <div id="checkout-form-container" class="checkout-form" style="display: none;">
                <h3><i class="fas fa-user-edit"></i> بيانات الشحن والدفع</h3>
                <div class="form-row">
                    <input type="text" id="customer-name" placeholder="الاسم الثلاثي" required>
                </div>
                <div class="form-row">
                    <input type="tel" id="customer-phone" placeholder="رقم الموبايل للتواصل" required>
                </div>
                <div class="form-row">
                    <input type="text" id="customer-address" placeholder="العنوان بالتفصيل (المدينة، الشارع، رقم العمارة)" required>
                </div>
                <button class="checkout-btn" onclick="finalizeOrder()">
                    <i class="fab fa-whatsapp"></i> إرسال الطلب عبر واتساب
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">تمت الإضافة للسلة بنجاح!</div>

    <script>
        // ==========================================
        // ⚙️ إعدادات المتجر - عدل رقمك هنا فقط
        // ==========================================
        const ADMIN_WHATSAPP_NUMBER = "201000000000"; // ضع رقمك هنا مع كود الدولة بدون +
        // ==========================================

        // --- إدارة البيانات ---
        let products = JSON.parse(localStorage.getItem('elite_products')) || [];
        let cart = JSON.parse(localStorage.getItem('elite_cart')) || [];

        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            updateCartCount();
        });

        // --- دوال العرض ---
        function renderProducts() {
            const customerGrid = document.getElementById('customer-products-grid');
            const adminList = document.getElementById('admin-products-list');
            
            customerGrid.innerHTML = '';
            adminList.innerHTML = '';

            if (products.length === 0) {
                customerGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 40px; color:#777;">لا توجد منتجات حالياً. قم بإضافتها من لوحة الإدارة.</p>';
                return;
            }

            products.forEach(product => {
                // عرض للعميل
                const card = `
                    <div class="product-card">
                        <img src="${product.image}" alt="${product.name}" class="product-img">
                        <div class="product-details">
                            <div class="product-name">${product.name}</div>
                            <div class="product-price">${product.price} ج.م</div>
                            <div class="product-stock">المتبقي: ${product.qty}</div>
                            <button class="add-to-cart-btn" onclick="addToCart(${product.id})">
                                <i class="fas fa-cart-plus"></i> أضف للسلة
                            </button>
                        </div>
                    </div>
                `;
                customerGrid.innerHTML += card;

                // عرض للأدمن
                const adminCard = `
                    <div class="product-card" style="border: 1px solid #eee;">
                        <img src="${product.image}" alt="${product.name}" class="product-img" style="height: 200px;">
                        <div class="product-details">
                            <div class="product-name">${product.name}</div>
                            <button class="btn-delete" onclick="deleteProduct(${product.id})" style="background:var(--danger); color:white; border:none; padding:8px; width:100%; border-radius:5px; cursor:pointer; margin-top:10px;">حذف المنتج</button>
                        </div>
                    </div>
                `;
                adminList.innerHTML += adminCard;
            });
        }

        // --- دوال السلة ---
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            if (product.qty <= 0) {
                showToast("نفذت الكمية من هذا المنتج!");
                return;
            }

            const existingItem = cart.find(item => item.id === id);
            if (existingItem) {
                if (existingItem.qty < product.qty) {
                    existingItem.qty++;
                } else {
                    showToast("لا يمكن إضافة كمية أكثر من المتوفر");
                    return;
                }
            } else {
                cart.push({ ...product, qty: 1 });
            }

            saveCart();
            updateCartCount();
            showToast("تمت الإضافة للسلة بنجاح!");
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            saveCart();
            renderCartItems();
            updateCartCount();
        }

        function saveCart() {
            localStorage.setItem('elite_cart', JSON.stringify(cart));
        }

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cart-count').innerText = count;
        }

        // --- دوال لوحة التحكم ---
        function toggleAdmin() {
            const panel = document.getElementById('admin-panel');
            if (panel.style.display === 'none' || panel.style.display === '') {
                const password = prompt("أدخل كلمة سر المدير:");
                if (password === "1234") { 
                    panel.style.display = 'block';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    renderProducts();
                } else if (password !== null) {
                    alert("كلمة السر خاطئة!");
                }
            } else {
                panel.style.display = 'none';
            }
        }

        document.getElementById('add-product-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const qty = document.getElementById('p-qty').value;
            const imageInput = document.getElementById('p-image');

            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const newProduct = {
                        id: Date.now(),
                        name,
                        price,
                        qty,
                        image: e.target.result
                    };
                    products.push(newProduct);
                    localStorage.setItem('elite_products', JSON.stringify(products));
                    
                    this.reset();
                    renderProducts();
                    alert("تم إضافة المنتج بنجاح!");
                }.bind(this);
                reader.readAsDataURL(imageInput.files[0]);
            }
        });

        function deleteProduct(id) {
            if(confirm("هل أنت متأكد من حذف هذا المنتج نهائياً؟")) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('elite_products', JSON.stringify(products));
                renderProducts();
            }
        }

        // --- دوال السلة والدفع (Checkout Logic) ---
        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            const formContainer = document.getElementById('checkout-form-container');
            
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                renderCartItems();
                // إعادة تعيين النموذج عند فتح السلة
                formContainer.style.display = 'none';
                document.getElementById('btn-show-checkout').style.display = 'flex';
                modal.style.display = 'flex';
            }
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items-container');
            const totalDisplay = document.getElementById('cart-total-display');
            
            if (cart.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #777; padding: 20px;">السلة فارغة حالياً</p>';
                totalDisplay.innerText = 'الإجمالي: 0 ج.م';
                document.getElementById('btn-show-checkout').style.display = 'none';
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                html += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <img src="${item.image}" class="cart-item-img">
                            <div>
                                <div style="font-weight:bold;">${item.name}</div>
                                <div style="font-size:0.9rem; color:#777;">${item.qty} × ${item.price} ج.م</div>
                            </div>
                        </div>
                        <button class="remove-item" onclick="removeFromCart(${item.id})"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            });

            container.innerHTML = html;
            totalDisplay.innerText = `الإجمالي: ${total} ج.م`;
            document.getElementById('btn-show-checkout').style.display = 'flex';
        }

        function showCheckoutForm() {
            document.getElementById('btn-show-checkout').style.display = 'none';
            document.getElementById('checkout-form-container').style.display = 'block';
            // تمرير الشاشة للأسفل لرؤية النموذج
            setTimeout(() => {
                document.querySelector('.modal-content').scrollTop = document.querySelector('.modal-content').scrollHeight;
            }, 100);
        }

        function finalizeOrder() {
            const name = document.getElementById('customer-name').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();
            const address = document.getElementById('customer-address').value.trim();

            if (!name || !phone || !address) {
                alert("يرجى ملء جميع البيانات (الاسم، رقم الموبايل، العنوان) لإتمام الطلب.");
                return;
            }

            if (cart.length === 0) {
                alert("السلة فارغة!");
                return;
            }

            // تجهيز رسالة الواتساب
            let message = `*طلب جديد من المتجر* 🛍️%0a%0a`;
            message += `*بيانات العميل:*%0a`;
            message += `👤 الاسم: ${name}%0a`;
            message += `📱 الموبايل: ${phone}%0a`;
            message += `📍 العنوان: ${address}%0a%0a`;
            
            message += `*تفاصيل الطلب:*%0a`;
            let total = 0;
            cart.forEach((item, index) => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                message += `${index + 1}. ${item.name} (عدد: ${item.qty}) - ${itemTotal} ج.م%0a`;
            });

            message += `%0a💰 *الإجمالي الكلي: ${total} ج.م*%0a`;
            message += `%0aطريقة الدفع: 💵 عند الاستلام`;
            message += `%0a%0aيرجى تأكيد الطلب وشكرًا لكم.`;

            const url = `https://wa.me/${ADMIN_WHATSAPP_NUMBER}?text=${message}`;
            window.open(url, '_blank');
            
            // اختياري: تفريغ السلة بعد الطلب
            // cart = [];
            // saveCart();
            // updateCartCount();
            // toggleCart();
        }

        // --- أدوات مساعدة ---
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        window.onclick = function(event) {
            const modal = document.getElementById('cart-modal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
