<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رويال فاشن | Royal Fashion</title>
    <!-- استدعاء خطوط عربية وإنجليزية فاخرة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- المتغيرات والألوان الفاخرة --- */
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --gold-primary: #d4af37;
            --gold-hover: #f9d86c;
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f9d86c 100%);
            --danger: #ff4d4d;
            --shadow: 0 10px 30px rgba(0,0,0,0.5);
            --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        h1, h2, h3 {
            font-family: 'Cinzel', serif; /* خط إنجليزي للعناوين الرئيسية لإعطاء طابع عالمي */
            letter-spacing: 1px;
        }

        /* --- شاشة الترحيب والتسجيل (Overlay) --- */
        #welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #2a2a2a 0%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .welcome-card {
            background: rgba(20, 20, 20, 0.95);
            padding: 50px;
            border-radius: 2px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #333;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.1);
            position: relative;
            overflow: hidden;
        }

        .welcome-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--gold-gradient);
        }

        .brand-logo {
            font-size: 2.5em;
            color: var(--gold-primary);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .welcome-text {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .luxury-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #444;
            padding: 15px 0;
            color: var(--text-main);
            font-size: 1em;
            margin-bottom: 25px;
            transition: var(--transition);
            font-family: 'Tajawal', sans-serif;
        }

        .luxury-input:focus {
            border-bottom-color: var(--gold-primary);
        }

        .luxury-input::placeholder {
            color: #555;
        }

        .btn-luxury {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Cinzel', serif;
        }

        .btn-luxury:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
        }

        /* --- التطبيق الرئيسي --- */
        #main-app {
            display: none;
            opacity: 0;
            transition: opacity 1s ease;
        }

        header {
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title span {
            color: var(--gold-primary);
        }

        /* --- لوحة الإدارة --- */
        .admin-section {
            max-width: 1000px;
            margin: 50px auto;
            padding: 40px;
            background: var(--card-bg);
            border: 1px solid #333;
            position: relative;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        .admin-title {
            font-size: 1.5em;
            color: var(--gold-primary);
        }

        .upload-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .upload-area { grid-template-columns: 1fr; }
        }

        .form-group label {
            display: block;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .form-control {
            width: 100%;
            background: #0f0f0f;
            border: 1px solid #333;
            padding: 12px;
            color: white;
            border-radius: 4px;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--gold-primary);
            background: #141414;
        }

        .file-drop-zone {
            border: 2px dashed #333;
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
            background: #0f0f0f;
            position: relative;
            overflow: hidden;
        }

        .file-drop-zone:hover {
            border-color: var(--gold-primary);
            background: #141414;
        }

        .file-drop-zone img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .file-drop-zone p {
            color: var(--text-muted);
            pointer-events: none;
            z-index: 2;
        }

        /* --- شبكة المنتجات --- */
        .products-section {
            max-width: 1200px;
            margin: 80px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 60px;
            color: var(--text-main);
            position: relative;
            display: inline-block;
            left: 50%;
            transform: translateX(-50%);
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: var(--gold-primary);
            margin: 15px auto 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 40px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid #222;
            transition: var(--transition);
            position: relative;
            group: 1;
        }

        .product-card:hover {
            transform: translateY(-10px);
            border-color: var(--gold-primary);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .card-img-wrapper {
            width: 100%;
            height: 350px;
            overflow: hidden;
            position: relative;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .product-card:hover .card-img {
            transform: scale(1.05);
        }

        .card-details {
            padding: 25px;
            text-align: center;
        }

        .p-name {
            font-size: 1.2em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .p-price {
            color: var(--gold-primary);
            font-size: 1.3em;
            font-family: 'Cinzel', serif;
            margin-bottom: 15px;
            display: block;
        }

        .p-stock {
            font-size: 0.85em;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: block;
        }

        .btn-delete {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 8px 20px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.8em;
            text-transform: uppercase;
        }

        .btn-delete:hover {
            background: var(--danger);
            color: white;
        }

        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            color: #444;
            padding: 50px;
            font-size: 1.2em;
        }

        /* إشعار ناجح */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--gold-primary);
            color: black;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            opacity: 0;
            transition: var(--transition);
            z-index: 2000;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

    </style>
</head>
<body>

    <!-- 1. شاشة التسجيل الأولى (تظهر مرة واحدة فقط) -->
    <div id="welcome-overlay">
        <div class="welcome-card">
            <div class="brand-logo">ROYAL FASHION</div>
            <p class="welcome-text">مرحباً بك في عالم الفخامة.<br>يرجى تسجيل بياناتك للدخول حصرياً.</p>
            
            <form id="register-form">
                <input type="tel" id="reg-phone" class="luxury-input" placeholder="رقم الهاتف المحمول" required>
                <input type="email" id="reg-email" class="luxury-input" placeholder="البريد الإلكتروني" required>
                <button type="submit" class="btn-luxury">دخول المتجر</button>
            </form>
        </div>
    </div>

    <!-- 2. التطبيق الرئيسي -->
    <div id="main-app">
        <header>
            <div class="header-title">ROYAL <span>FASHION</span></div>
            <div style="font-size: 0.9em; color: var(--text-muted);">
                <span id="user-display">زائر مميز</span>
            </div>
        </header>

        <!-- لوحة التحكم -->
        <section class="admin-section">
            <div class="admin-header">
                <h3 class="admin-title">إدارة التشكيلة الجديدة</h3>
                <div style="width: 30px; height: 30px; background: var(--gold-primary); border-radius: 50%;"></div>
            </div>

            <form id="add-product-form">
                <div class="upload-area">
                    <div class="form-col">
                        <div class="form-group">
                            <label>اسم القطعة</label>
                            <input type="text" id="p-name" class="form-control" required placeholder="مثال: سترة مخمل سوداء">
                        </div>
                        <div class="form-group">
                            <label>السعر (EGP)</label>
                            <input type="number" id="p-price" class="form-control" required placeholder="0000">
                        </div>
                        <div class="form-group">
                            <label>الكمية بالمخزن</label>
                            <input type="number" id="p-qty" class="form-control" required placeholder="00">
                        </div>
                    </div>
                    
                    <div class="form-col">
                        <div class="form-group">
                            <label>صورة المنتج</label>
                            <div class="file-drop-zone" id="drop-zone" onclick="document.getElementById('p-image').click()">
                                <img id="preview-img" src="" alt="Preview">
                                <p id="drop-text">اضغط لرفع صورة أو اسحبها هنا</p>
                                <input type="file" id="p-image" accept="image/*" hidden required onchange="previewFile()">
                            </div>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn-luxury" style="margin-top: 30px; max-width: 200px;">إضافة للتشكيلة</button>
            </form>
        </section>

        <!-- عرض المنتجات -->
        <section class="products-section">
            <h2 class="section-title">أحدث الوصول</h2>
            <div class="grid" id="products-grid">
                <!-- المنتجات ستظهر هنا -->
            </div>
        </section>
    </div>

    <!-- إشعار منبثق -->
    <div id="toast" class="toast">تمت العملية بنجاح</div>

    <script>
        // --- منطق العمل (JavaScript) ---

        const overlay = document.getElementById('welcome-overlay');
        const mainApp = document.getElementById('main-app');
        const registerForm = document.getElementById('register-form');
        const userDisplay = document.getElementById('user-display');
        
        // 1. فحص حالة المستخدم عند التحميل
        window.addEventListener('load', () => {
            const isRegistered = localStorage.getItem('royal_user_registered');
            
            if (isRegistered === 'true') {
                enterStore();
                // استرجاع اسم المستخدم للعرض
                const savedEmail = localStorage.getItem('royal_user_email');
                if(savedEmail) userDisplay.textContent = savedEmail.split('@')[0];
            } else {
                overlay.style.visibility = 'visible';
                overlay.style.opacity = '1';
                mainApp.style.display = 'none';
            }
        });

        // 2. عملية التسجيل والدخول
        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const phone = document.getElementById('reg-phone').value;
            const email = document.getElementById('reg-email').value;

            if(phone && email) {
                // حفظ البيانات
                localStorage.setItem('royal_user_registered', 'true');
                localStorage.setItem('royal_user_phone', phone);
                localStorage.setItem('royal_user_email', email);
                
                // تأثير اختفاء الشاشة الترحيبية
                overlay.style.opacity = '0';
                overlay.style.visibility = 'hidden';
                
                setTimeout(() => {
                    enterStore();
                    userDisplay.textContent = email.split('@')[0];
                }, 800);
            }
        });

        function enterStore() {
            mainApp.style.display = 'block';
            // تأخير بسيط لتفعيل الـ Opacity Transition
            setTimeout(() => {
                mainApp.style.opacity = '1';
            }, 50);
            loadProducts();
        }

        // 3. معالجة رفع الصور والمعاينة
        function previewFile() {
            const preview = document.getElementById('preview-img');
            const file = document.getElementById('p-image').files[0];
            const dropText = document.getElementById('drop-text');

            if (file) {
                const reader = new FileReader();
                reader.onloadend = function () {
                    preview.src = reader.result;
                    preview.style.display = 'block';
                    dropText.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        }

        // 4. إضافة منتج جديد
        const productForm = document.getElementById('add-product-form');
        
        productForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const qty = document.getElementById('p-qty').value;
            const imageInput = document.getElementById('p-image');
            
            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const product = {
                        id: Date.now(),
                        name: name,
                        price: price,
                        qty: qty,
                        image: e.target.result
                    };

                    // حفظ في LocalStorage
                    let products = JSON.parse(localStorage.getItem('royal_products')) || [];
                    products.unshift(product); // إضافة في البداية
                    localStorage.setItem('royal_products', JSON.stringify(products));

                    // إعادة تعيين النموذج وتحديث العرض
                    productForm.reset();
                    document.getElementById('preview-img').style.display = 'none';
                    document.getElementById('drop-text').style.display = 'block';
                    document.getElementById('preview-img').src = '';
                    
                    loadProducts();
                    showToast('تم إضافة المنتج للفخامة بنجاح');
                };
                reader.readAsDataURL(imageInput.files[0]);
            }
        });

        // 5. عرض المنتجات
        function loadProducts() {
            const grid = document.getElementById('products-grid');
            const products = JSON.parse(localStorage.getItem('royal_products')) || [];
            
            grid.innerHTML = '';

            if (products.length === 0) {
                grid.innerHTML = '<div class="empty-msg">المجموعة فارغة حالياً. كن أول من يضيف قطعة فاخرة.</div>';
                return;
            }

            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${p.image}" alt="${p.name}" class="card-img">
                    </div>
                    <div class="card-details">
                        <h3 class="p-name">${p.name}</h3>
                        <span class="p-price">${Number(p.price).toLocaleString()} EGP</span>
                        <span class="p-stock">المتبقي: ${p.qty} قطعة</span>
                        <button class="btn-delete" onclick="deleteProduct(${p.id})">حذف من المجموعة</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 6. حذف منتج
        window.deleteProduct = function(id) {
            if(confirm('هل أنت متأكد من رغبتك في حذف هذه القطعة؟')) {
                let products = JSON.parse(localStorage.getItem('royal_products')) || [];
                products = products.filter(p => p.id !== id);
                localStorage.setItem('royal_products', JSON.stringify(products));
                loadProducts();
                showToast('تم حذف المنتج');
            }
        };

        // دالة الإشعار
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
